<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Szachowa Szwagrów</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .btn-nav.active { border-bottom: 2px solid #0d9488; color: #0d9488; font-weight: bold; }
        
        /* SZACHOWNICA */
        .chessboard {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 0;
    width: min(90vw, 65vh, 450px);
    height: min(90vw, 65vh, 450px);
    margin: 0 auto;
    border: 3px solid #333;
    background: #999;
    box-sizing: border-box;
    padding: 0;
}
        
        .square {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: grab;
            user-select: none;
            position: relative;
            font-weight: bold;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
        }
        
        .square.light {
            background-color: #f0d9b5;
        }
        
        .square.dark {
            background-color: #b58863;
        }
        
        .square.selected {
            background-color: #baca44 !important;
            box-shadow: inset 0 0 0 2px #7d8000;
        }
        
        .square.highlight {
            background-color: #7d8000 !important;
        }
        
        .piece {
            cursor: grab;
            draggable: true;
        }
        
        .piece:active {
            cursor: grabbing;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <!-- LOGIN -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-lg w-96">
            <h1 class="text-2xl font-bold mb-6 text-center text-teal-700">♟️ Szach-Mat Szwagry</h1>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Wybierz zawodnika</label>
                    <select id="login-user" class="mt-1 block w-full p-2 border rounded">
                        <option value="Maciek">Maciek</option>
                        <option value="Rafał">Rafał</option>
                        <option value="Marcin">Marcin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">PIN</label>
                    <input type="password" id="login-pin" class="mt-1 block w-full p-2 border rounded" placeholder="1111, 2222 lub 3333">
                </div>
                <button onclick="app.login()" class="w-full bg-teal-600 text-white p-2 rounded hover:bg-teal-700 transition">Zaloguj</button>
                <p id="login-error" class="text-red-500 text-sm text-center hidden">Błędny PIN!</p>
            </div>
        </div>
    </div>

    <!-- GŁÓWNA APLIKACJA -->
    <div id="app-screen" class="hidden max-w-4xl mx-auto p-4">
        <!-- HEADER -->
        <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-xl font-bold text-gray-800">Liga Szachowa</h2>
            <div class="flex items-center gap-4">
                <span class="text-gray-600 text-sm md:text-base">Gracz: <span id="current-player-name" class="font-bold text-teal-600"></span></span>
                <button onclick="app.logout()" class="text-xs border px-2 py-1 rounded hover:bg-gray-50">Wyloguj</button>
            </div>
        </div>

        <!-- NAWIGACJA -->
        <div class="bg-white rounded-lg shadow mb-6 overflow-hidden">
            <div class="flex border-b">
                <button onclick="app.showTab('ranking')" class="btn-nav flex-1 p-3 text-sm md:text-base hover:bg-gray-50 active" id="nav-ranking">Ranking</button>
                <button onclick="app.showTab('new-match')" class="btn-nav flex-1 p-3 text-sm md:text-base hover:bg-gray-50" id="nav-new-match">Graj</button>
                <button onclick="app.showTab('history')" class="btn-nav flex-1 p-3 text-sm md:text-base hover:bg-gray-50" id="nav-history">Historia</button>
            </div>

            <!-- TAB: RANKING -->
            <div id="tab-ranking" class="tab-content active p-4 md:p-6">
                <div class="text-center mb-6">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest">Mistrz Sezonu</h3>
                    <div id="champion-display" class="text-2xl font-bold text-yellow-600 mt-1">-</div>
                </div>
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200 text-sm">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-2 text-left">Gracz</th>
                                <th class="px-4 py-2 text-center">Mecze</th>
                                <th class="px-4 py-2 text-center text-green-600">W</th>
                                <th class="px-4 py-2 text-center text-gray-500">R</th>
                                <th class="px-4 py-2 text-center text-red-500">P</th>
                                <th class="px-4 py-2 text-center font-bold">PKT</th>
                            </tr>
                        </thead>
                        <tbody id="ranking-body" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB: GRA -->
            <div id="tab-new-match" class="tab-content p-4 md:p-6">
                <!-- Setup -->
                <div id="game-setup">
                    <h3 class="text-lg font-bold mb-4">Nowy Mecz</h3>
                    
                    <!-- Wybór typu gry -->
                    <div class="mb-6 flex gap-2">
                        <button onclick="gameMode.setMode('official')" class="flex-1 py-2 rounded bg-teal-600 text-white font-bold hover:bg-teal-700" id="mode-official">Mecz oficjalny</button>
                        <button onclick="gameMode.setMode('training')" class="flex-1 py-2 rounded border-2 border-teal-600 text-teal-600 font-bold hover:bg-teal-50" id="mode-training">Trening z CPU</button>
                    </div>

                    <!-- Setup meczy oficjalnych -->
                    <div id="official-setup" class="block">
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase">Białe</label>
                                <select id="white-player" class="mt-1 block w-full p-2 border rounded">
                                    <option value="Maciek">Maciek</option>
                                    <option value="Rafał">Rafał</option>
                                    <option value="Marcin">Marcin</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-500 uppercase">Czarne</label>
                                <select id="black-player" class="mt-1 block w-full p-2 border rounded">
                                    <option value="Rafał">Rafał</option>
                                    <option value="Maciek">Maciek</option>
                                    <option value="Marcin">Marcin</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-6">
                            <label class="block text-xs font-bold text-gray-500 uppercase mb-2">Limit czasu</label>
                            <div class="flex gap-2">
                                <button onclick="gameMode.setTimeLimit(5)" class="flex-1 py-2 rounded bg-blue-100 border-2 border-blue-300 font-bold hover:bg-blue-200" id="time-5">5 min</button>
                                <button onclick="gameMode.setTimeLimit(10)" class="flex-1 py-2 rounded bg-teal-600 text-white border-2 border-teal-600 font-bold hover:bg-teal-700" id="time-10">10 min</button>
                                <button onclick="gameMode.setTimeLimit(15)" class="flex-1 py-2 rounded bg-blue-100 border-2 border-blue-300 font-bold hover:bg-blue-200" id="time-15">15 min</button>
                                <button onclick="gameMode.setTimeLimit(0)" class="flex-1 py-2 rounded bg-purple-100 border-2 border-purple-300 font-bold hover:bg-purple-200" id="time-unlimited">∞</button>
                            </div>
                        </div>
                        <button onclick="game.start()" class="w-full bg-teal-600 text-white p-3 rounded font-bold hover:bg-teal-700 shadow-lg transform transition active:scale-95">Rozpocznij Mecz</button>
                    </div>

                    <!-- Setup treningu z CPU -->
                    <div id="training-setup" class="hidden">
                        <div class="mb-6">
                            <label class="block text-xs font-bold text-gray-500 uppercase">Gracz</label>
                            <select id="training-player" class="mt-1 block w-full p-2 border rounded">
                                <option value="Maciek">Maciek</option>
                                <option value="Rafał">Rafał</option>
                                <option value="Marcin">Marcin</option>
                            </select>
                        </div>
                        <div class="mb-6">
                            <label class="block text-xs font-bold text-gray-500 uppercase">Grasz jako:</label>
                            <div class="flex gap-2">
                                <button onclick="gameMode.setPieceColor('white')" class="flex-1 py-2 rounded bg-white border-2 border-gray-400 font-bold hover:border-gray-600" id="color-white">Białe ♔</button>
                                <button onclick="gameMode.setPieceColor('black')" class="flex-1 py-2 rounded bg-gray-800 text-white border-2 border-gray-800 font-bold hover:bg-gray-900" id="color-black">Czarne ♚</button>
                            </div>
                        </div>
                        <button onclick="game.startTraining()" class="w-full bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 shadow-lg transform transition active:scale-95">Rozpocznij Trening</button>
                    </div>
                </div>

                <!-- Terminarz meczów -->
                <div id="schedule-section" class="mt-8 pt-8 border-t">
                    <h3 class="text-lg font-bold mb-4">📅 Terminarz Meczów</h3>
                    <div class="mb-4 flex gap-2">
                        <input type="date" id="match-date" class="flex-1 p-2 border rounded">
                        <button onclick="schedule.addMatch()" class="bg-teal-600 text-white px-4 py-2 rounded font-bold hover:bg-teal-700">Zaplanuj</button>
                    </div>
                    <div id="schedule-list" class="space-y-2"></div>
                </div>

                <!-- Plansza -->
                <div id="game-active" class="hidden p-0 md:p-4">
                    <div class="flex justify-between items-center mb-2 text-xs md:text-sm gap-1 px-1 md:px-2">
                        <div class="text-center flex-1 min-w-0">
                            <span class="font-bold text-gray-700 block truncate" id="game-white-name"></span>
                            <div class="text-base md:text-lg font-bold" id="timer-white" style="color: #059669; font-family: monospace;">10:00</div>
                        </div>
                        <span id="game-status" class="text-xs font-bold text-red-500 flex-shrink-0"></span>
                        <div class="text-center flex-1 min-w-0">
                            <span class="font-bold text-gray-700 block truncate" id="game-black-name"></span>
                            <div class="text-base md:text-lg font-bold" id="timer-black" style="color: #059669; font-family: monospace;">10:00</div>
                        </div>
                    </div>
                    
                    <div class="flex justify-center px-1 md:px-2">
                        <div class="chessboard" id="chessboard"></div>
                    </div>

                    <!-- Przyciski sterowania grą -->
                    <div class="flex gap-1 md:gap-2 mb-1 md:mb-4 mt-1 md:mt-4 px-1 md:px-2">
                         <button onclick="game.undo()" class="flex-1 bg-gray-200 text-gray-700 py-1 md:py-2 rounded text-xs md:text-sm font-medium hover:bg-gray-300">Cofnij</button>
                         <button onclick="game.cancel()" class="flex-1 border border-red-200 text-red-600 py-1 md:py-2 rounded text-xs md:text-sm font-medium hover:bg-red-50">Anuluj</button>
                    </div>

                    <!-- Przyciski wyniku -->
                    <div class="grid grid-cols-3 gap-1 md:gap-2">
                        <button onclick="game.endGame('white')" class="bg-green-600 text-white py-2 md:py-3 rounded text-xs md:text-sm font-bold shadow hover:bg-green-700">Białe</button>
                        <button onclick="game.endGame('draw')" class="bg-gray-500 text-white py-2 md:py-3 rounded text-xs md:text-sm font-bold shadow hover:bg-gray-600">Remis</button>
                        <button onclick="game.endGame('black')" class="bg-gray-800 text-white py-2 md:py-3 rounded text-xs md:text-sm font-bold shadow hover:bg-gray-900">Czarne</button>
                    </div>
                </div>
            </div>

            <!-- TAB: HISTORIA -->
            <div id="tab-history" class="tab-content p-4 md:p-6">
                <h3 class="text-lg font-bold mb-4">Ostatnie mecze</h3>
                <ul id="match-history-list" class="space-y-2"></ul>
            </div>
        </div>
    </div>

    <script>
        // UNICODY FIGUR SZACHOWYCH
        const PIECES = {
            'wK': '♔', 'wQ': '♕', 'wR': '♖', 'wB': '♗', 'wN': '♘', 'wP': '♙',
            'bK': '♚', 'bQ': '♛', 'bR': '♜', 'bB': '♝', 'bN': '♞', 'bP': '♟'
        };

        // --- BAZA DANYCH ---
        const DB = {
            players: [
                { name: 'Maciek', pin: '1111' },
                { name: 'Rafał', pin: '2222' },
                { name: 'Marcin', pin: '3333' }
            ],
            getData: () => JSON.parse(localStorage.getItem('chessAppData')) || { matches: [], season: 1 },
            saveData: (data) => localStorage.setItem('chessAppData', JSON.stringify(data)),
            
            addMatch: (white, black, result) => {
                const data = DB.getData();
                data.matches.push({
                    id: Date.now(),
                    date: new Date().toLocaleDateString(),
                    white, black, result,
                    season: data.season
                });
                DB.saveData(data);
                app.render();
            },
            
            getStats: () => {
                const data = DB.getData();
                let stats = {};
                DB.players.forEach(p => stats[p.name] = { w:0, d:0, l:0, pts:0, games:0 });
                data.matches.forEach(m => {
                    if(m.season !== data.season) return;
                    if(m.result === '1-0') { stats[m.white].w++; stats[m.white].pts+=1; stats[m.black].l++; }
                    else if(m.result === '0-1') { stats[m.black].w++; stats[m.black].pts+=1; stats[m.white].l++; }
                    else { stats[m.white].d++; stats[m.white].pts+=0.5; stats[m.black].d++; stats[m.black].pts+=0.5; }
                    stats[m.white].games++; stats[m.black].games++;
                });
                return Object.entries(stats).map(([n,s]) => ({name:n, ...s})).sort((a,b) => b.pts - a.pts);
            }
        };

        // --- INTERFEJS ---
        const app = {
            currentUser: null,
            init: () => {
                if(localStorage.getItem('chessUser')) {
                    app.currentUser = localStorage.getItem('chessUser');
                    app.showApp();
                }
            },
            login: () => {
                const u = document.getElementById('login-user').value;
                const p = document.getElementById('login-pin').value;
                if(DB.players.find(x => x.name === u && x.pin === p)) {
                    app.currentUser = u;
                    localStorage.setItem('chessUser', u);
                    app.showApp();
                } else document.getElementById('login-error').classList.remove('hidden');
            },
            logout: () => { localStorage.removeItem('chessUser'); location.reload(); },
            showApp: () => {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('current-player-name').innerText = app.currentUser;
                app.render();
            },
            showTab: (id) => {
                document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
                document.querySelectorAll('.btn-nav').forEach(e => e.classList.remove('active'));
                document.getElementById('tab-'+id).classList.add('active');
                document.getElementById('nav-'+id).classList.add('active');
            },
            render: () => {
                const stats = DB.getStats();
                const tbody = document.getElementById('ranking-body');
                tbody.innerHTML = '';
                document.getElementById('champion-display').innerText = (stats.length && stats[0].games > 0) 
                    ? `${stats[0].name} (${stats[0].pts} pkt)` : 'Brak meczów';

                stats.forEach(s => {
                    tbody.innerHTML += `<tr>
                        <td class="px-4 py-2 font-medium">${s.name}</td>
                        <td class="px-4 py-2 text-center text-gray-600">${s.games}</td>
                        <td class="px-4 py-2 text-center text-green-600">${s.w}</td>
                        <td class="px-4 py-2 text-center text-gray-500">${s.d}</td>
                        <td class="px-4 py-2 text-center text-red-500">${s.l}</td>
                        <td class="px-4 py-2 text-center font-bold text-gray-800">${s.pts}</td>
                    </tr>`;
                });

                const hist = document.getElementById('match-history-list');
                hist.innerHTML = '';
                DB.getData().matches.reverse().forEach(m => {
                    const res = m.result==='1-0' ? '1:0' : (m.result==='0-1' ? '0:1' : '½:½');
                    hist.innerHTML += `<li class="bg-white border rounded p-3 flex justify-between items-center text-sm shadow-sm">
                        <div><span class="font-bold">${m.white}</span> vs <span class="font-bold">${m.black}</span></div>
                        <div class="font-bold text-teal-700 bg-teal-50 px-2 py-1 rounded">${res}</div>
                    </li>`;
                });
            }
        };

        // --- GAME MODE ---
        const gameMode = {
            mode: 'official',
            pieceColor: 'white',
            timeLimit: 10,
            
            setTimeLimit: (mins) => {
                gameMode.timeLimit = mins;
                document.getElementById('time-5').classList.toggle('bg-teal-600', mins === 5);
                document.getElementById('time-5').classList.toggle('text-white', mins === 5);
                document.getElementById('time-5').classList.toggle('border-teal-600', mins === 5);
                document.getElementById('time-5').classList.toggle('bg-blue-100', mins !== 5);
                document.getElementById('time-5').classList.toggle('border-blue-300', mins !== 5);
                
                document.getElementById('time-10').classList.toggle('bg-teal-600', mins === 10);
                document.getElementById('time-10').classList.toggle('text-white', mins === 10);
                document.getElementById('time-10').classList.toggle('border-teal-600', mins === 10);
                document.getElementById('time-10').classList.toggle('bg-blue-100', mins !== 10);
                document.getElementById('time-10').classList.toggle('border-blue-300', mins !== 10);
                
                document.getElementById('time-15').classList.toggle('bg-teal-600', mins === 15);
                document.getElementById('time-15').classList.toggle('text-white', mins === 15);
                document.getElementById('time-15').classList.toggle('border-teal-600', mins === 15);
                document.getElementById('time-15').classList.toggle('bg-blue-100', mins !== 15);
                document.getElementById('time-15').classList.toggle('border-blue-300', mins !== 15);

                document.getElementById('time-unlimited').classList.toggle('bg-teal-600', mins === 0);
                document.getElementById('time-unlimited').classList.toggle('text-white', mins === 0);
                document.getElementById('time-unlimited').classList.toggle('border-teal-600', mins === 0);
                document.getElementById('time-unlimited').classList.toggle('bg-purple-100', mins !== 0);
                document.getElementById('time-unlimited').classList.toggle('border-purple-300', mins !== 0);
            },
            
            setMode: (m) => {
                gameMode.mode = m;
                document.getElementById('official-setup').classList.toggle('hidden', m !== 'official');
                document.getElementById('training-setup').classList.toggle('hidden', m !== 'training');
                document.getElementById('mode-official').classList.toggle('bg-teal-600', m === 'official');
                document.getElementById('mode-official').classList.toggle('border-2', m !== 'official');
                document.getElementById('mode-official').classList.toggle('border-teal-600', m !== 'official');
                document.getElementById('mode-official').classList.toggle('text-teal-600', m !== 'official');
                document.getElementById('mode-training').classList.toggle('bg-blue-600', m === 'training');
                document.getElementById('mode-training').classList.toggle('text-white', m === 'training');
                document.getElementById('mode-training').classList.toggle('border-blue-600', m === 'training');
            },

            setPieceColor: (color) => {
                gameMode.pieceColor = color;
                document.getElementById('color-white').classList.toggle('bg-blue-100', color === 'white');
                document.getElementById('color-black').classList.toggle('bg-blue-100', color === 'black');
            }
        };

        // --- SCHEDULE ---
        const schedule = {
            getSchedule: () => JSON.parse(localStorage.getItem('chessSchedule')) || [],
            saveSchedule: (s) => localStorage.setItem('chessSchedule', JSON.stringify(s)),
            
            addMatch: () => {
                const date = document.getElementById('match-date').value;
                if(!date) return alert('Wybierz datę!');
                const sched = schedule.getSchedule();
                sched.push({ date, completed: false });
                schedule.saveSchedule(sched);
                schedule.render();
            },

            render: () => {
                const list = document.getElementById('schedule-list');
                const sched = schedule.getSchedule();
                list.innerHTML = '';
                if(sched.length === 0) {
                    list.innerHTML = '<p class="text-gray-400 text-sm">Brak zaplanowanych meczów</p>';
                    return;
                }
                sched.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach((m, idx) => {
                    const d = new Date(m.date).toLocaleDateString('pl-PL');
                    list.innerHTML += `<div class="bg-white border rounded p-3 flex justify-between items-center text-sm">
                        <span>${d}</span>
                        <button onclick="schedule.removeMatch(${idx})" class="text-red-500 text-xs hover:text-red-700">✕</button>
                    </div>`;
                });
            },

            removeMatch: (idx) => {
                const sched = schedule.getSchedule();
                sched.splice(idx, 1);
                schedule.saveSchedule(sched);
                schedule.render();
            }
        };

        // --- CHESS AI (CPU) ---
        const cpu = {
            getRandomMove: (chessGame) => {
                const moves = chessGame.moves({ verbose: true });
                if(moves.length === 0) return null;
                return moves[Math.floor(Math.random() * moves.length)];
            },

            makeMove: () => {
                if(game.chess.game_over()) return;
                if(game.chess.turn() === 'w' && gameMode.pieceColor === 'black') {
                    setTimeout(() => {
                        const move = cpu.getRandomMove(game.chess);
                        if(move) {
                            game.chess.move(move);
                            game.renderBoard();
                            game.updateStatus();
                        }
                    }, 800);
                } else if(game.chess.turn() === 'b' && gameMode.pieceColor === 'white') {
                    setTimeout(() => {
                        const move = cpu.getRandomMove(game.chess);
                        if(move) {
                            game.chess.move(move);
                            game.renderBoard();
                            game.updateStatus();
                        }
                    }, 800);
                }
            }
        };

        // --- GRA ---
        const game = {
            chess: null,
            wPlayer: null,
            bPlayer: null,
            isTraining: false,
            selectedSquare: null,
            validMoves: [],
            timerInterval: null,
            whiteTimeMs: 600000,
            blackTimeMs: 600000,

            start: () => {
                const w = document.getElementById('white-player').value;
                const b = document.getElementById('black-player').value;
                if(w === b) return alert('Wybierz dwóch różnych graczy!');
                
                game.wPlayer = w;
                game.bPlayer = b;
                
                document.getElementById('game-setup').classList.add('hidden');
                document.getElementById('game-active').classList.remove('hidden');
                document.getElementById('game-white-name').innerText = '⚪ ' + w;
                document.getElementById('game-black-name').innerText = '⚫ ' + b;

                game.chess = new Chess();
                game.isTraining = false;
                const timeLimitMs = gameMode.timeLimit === 0 ? Infinity : gameMode.timeLimit * 60 * 1000;
                game.whiteTimeMs = timeLimitMs;
                game.blackTimeMs = timeLimitMs;
                game.renderBoard();
                game.startTimer();
            },

            startTraining: () => {
                const player = document.getElementById('training-player').value;
                game.wPlayer = gameMode.pieceColor === 'white' ? player : 'CPU';
                game.bPlayer = gameMode.pieceColor === 'black' ? player : 'CPU';
                game.isTraining = true;
                
                document.getElementById('game-setup').classList.add('hidden');
                document.getElementById('game-active').classList.remove('hidden');
                document.getElementById('game-white-name').innerText = '⚪ ' + game.wPlayer;
                document.getElementById('game-black-name').innerText = '⚫ ' + game.bPlayer;

                game.chess = new Chess();
                game.renderBoard();
                
                if(gameMode.pieceColor === 'black') {
                    setTimeout(() => cpu.makeMove(), 500);
                }
            },

            renderBoard: () => {
                const board = document.getElementById('chessboard');
                board.innerHTML = '';
                const pieces = game.chess.board();
                
                for(let r = 0; r < 8; r++) {
                    for(let c = 0; c < 8; c++) {
                        const isLight = (r + c) % 2 === 0;
                        const square = document.createElement('div');
                        square.className = `square ${isLight ? 'light' : 'dark'}`;
                        square.id = `sq-${String.fromCharCode(97+c)}${8-r}`;
                        
                        const piece = pieces[r][c];
                        if(piece) {
                            const pieceEl = document.createElement('div');
                            pieceEl.className = 'piece';
                            const key = piece.color + piece.type.toUpperCase();
                            pieceEl.textContent = PIECES[key];
                            pieceEl.draggable = true;
                            pieceEl.dataset.square = square.id.substr(3);
                            
                            pieceEl.addEventListener('dragstart', game.onDragStart);
                            pieceEl.addEventListener('dragend', game.onDragEnd);
                            square.appendChild(pieceEl);
                        }
                        
                        square.addEventListener('dragover', (e) => e.preventDefault());
                        square.addEventListener('drop', game.onDrop);
                        square.addEventListener('click', () => game.selectSquare(square.id.substr(3)));
                        
                        board.appendChild(square);
                    }
                }
            },

            selectSquare: (sq) => {
                if(game.isTraining && gameMode.pieceColor === 'black' && game.chess.turn() === 'w') return;
                if(game.isTraining && gameMode.pieceColor === 'white' && game.chess.turn() === 'b') return;
                const currentPlayer = game.chess.turn() === 'w' ? game.wPlayer : game.bPlayer;
                if(!game.isTraining && currentPlayer !== app.currentUser) return;
                
                // Jeśli pole już zaznaczone, spróbuj wykonać ruch
                if(game.selectedSquare && game.validMoves.find(m => m.to === sq)) {
                    game.makeMove(game.selectedSquare, sq);
                    return;
                }
                
                document.querySelectorAll('.square').forEach(s => s.classList.remove('selected', 'highlight'));
                
                if(game.selectedSquare === sq) {
                    game.selectedSquare = null;
                    game.validMoves = [];
                    return;
                }
                
                const moves = game.chess.moves({ square: sq, verbose: true });
                if(moves.length === 0) return;
                
                game.selectedSquare = sq;
                document.getElementById('sq-' + sq).classList.add('selected');
                
                moves.forEach(m => {
                    document.getElementById('sq-' + m.to).classList.add('highlight');
                });
                
                game.validMoves = moves;
            },

            onDragStart: (e) => {
                if(game.isTraining && gameMode.pieceColor === 'black' && game.chess.turn() === 'w') {
                    e.preventDefault();
                    return;
                }
                if(game.isTraining && gameMode.pieceColor === 'white' && game.chess.turn() === 'b') {
                    e.preventDefault();
                    return;
                }
                // Blokada ruchu dla gracza, który nie jest u tury
                const currentPlayer = game.chess.turn() === 'w' ? game.wPlayer : game.bPlayer;
                if(!game.isTraining && currentPlayer !== app.currentUser) {
                    e.preventDefault();
                    return;
                }
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('from', e.target.dataset.square);
            },

            onDragEnd: (e) => {
                document.querySelectorAll('.square').forEach(s => s.classList.remove('selected', 'highlight'));
                game.selectedSquare = null;
            },

            onDrop: (e) => {
                e.preventDefault();
                const from = e.dataTransfer.getData('from');
                const to = e.target.closest('.square').id.substr(3);
                game.makeMove(from, to);
            },

            makeMove: (from, to) => {
                const move = game.chess.move({ from, to, promotion: 'q' });
                if(!move) return;
                
                // Sprawdzenie czy gracz wykonujący ruch to gracz, któremu należy tura
                const currentPlayer = game.chess.turn() === 'w' ? game.bPlayer : game.wPlayer;
                if(!game.isTraining && currentPlayer !== app.currentUser) {
                    alert(`To nie Twoja tura! Czeka na ruch: ${currentPlayer}`);
                    game.chess.undo();
                    return;
                }
                
                game.renderBoard();
                game.updateStatus();
                game.selectedSquare = null;
                game.validMoves = [];
                
                if(game.isTraining) {
                    setTimeout(() => cpu.makeMove(), 500);
                }
            },

            cancel: () => {
                if(confirm('Na pewno anulować grę? Wynik nie zostanie zapisany.')) {
                    game.resetUI();
                }
            },
            
            undo: () => {
                game.chess.undo();
                game.renderBoard();
                game.updateStatus();
            },

            resetUI: () => {
                document.getElementById('game-active').classList.add('hidden');
                document.getElementById('game-setup').classList.remove('hidden');
                game.chess = null;
                if(game.timerInterval) clearInterval(game.timerInterval);
            },
            
            startTimer: () => {
                if(game.timerInterval) clearInterval(game.timerInterval);
                if(gameMode.timeLimit === 0) return; // Bez limitu czasu
                game.timerInterval = setInterval(() => {
                    if(game.chess.turn() === 'w') {
                        game.whiteTimeMs -= 100;
                        if(game.whiteTimeMs <= 0) {
                            game.whiteTimeMs = 0;
                            clearInterval(game.timerInterval);
                            game.endGame('black');
                            return;
                        }
                    } else {
                        game.blackTimeMs -= 100;
                        if(game.blackTimeMs <= 0) {
                            game.blackTimeMs = 0;
                            clearInterval(game.timerInterval);
                            game.endGame('white');
                            return;
                        }
                    }
                    game.updateTimerDisplay();
                }, 100);
            },
            
            updateTimerDisplay: () => {
                const formatTime = (ms) => {
                    if(ms === Infinity) return '∞';
                    const mins = Math.floor(ms / 60000);
                    const secs = Math.floor((ms % 60000) / 1000);
                    return `${mins}:${secs.toString().padStart(2, '0')}`;
                };
                document.getElementById('timer-white').textContent = formatTime(game.whiteTimeMs);
                document.getElementById('timer-black').textContent = formatTime(game.blackTimeMs);
                
                // Podświetl grę jeśli czas poniżej 1 minuty
                const timerWhite = document.getElementById('timer-white');
                const timerBlack = document.getElementById('timer-black');
                timerWhite.style.color = game.whiteTimeMs < 60000 ? '#dc2626' : '#059669';
                timerBlack.style.color = game.blackTimeMs < 60000 ? '#dc2626' : '#059669';
            },

            updateStatus: () => {
                let status = '';
                if(game.chess.in_checkmate()) status = 'SZACH MAT!';
                else if(game.chess.in_draw()) status = 'REMIS!';
                else if(game.chess.in_check()) status = 'SZACH!';
                document.getElementById('game-status').innerText = status;
            },

            endGame: (winner) => {
                if(game.timerInterval) clearInterval(game.timerInterval);
                
                let r, msg;
                if(winner==='white') { r='1-0'; msg=`Wygrywa ${game.wPlayer}! (${game.bPlayer} przekroczył czas)`; }
                else if(winner==='black') { r='0-1'; msg=`Wygrywa ${game.bPlayer}! (${game.wPlayer} przekroczył czas)`; }
                else if(winner==='draw') { r='0.5-0.5'; msg='Remis!'; }
                else { r='0.5-0.5'; msg='Remis!'; }
                
                if(confirm(`Zakończyć grę: ${msg}`)) {
                    if(!game.isTraining) {
                        DB.addMatch(game.wPlayer, game.bPlayer, r);
                    }
                    game.resetUI();
                    app.showTab('ranking');
                }
            }
        };

        app.init();
        schedule.render();
    </script>
</body>
</html>
